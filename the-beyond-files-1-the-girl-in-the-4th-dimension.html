<script>(()=>{'use strict';let PART=1,SLOT=1;

/* ---------- small UI helpers ---------- */
let subT = 0, banT = 0, primaryBtn = null;
function say(text, ms) { const n = $('sub'); n.textContent = text; n.classList.add('on'); clearTimeout(subT); subT = setTimeout(() => n.classList.remove('on'), ms || 4800); }
function setPrompt(html) { const n = $('prompt'); if (html) { if (n.dataset.h !== html) { n.innerHTML = html; n.dataset.h = html; } n.classList.add('on'); } else n.classList.remove('on'); }
function banner(txt, sub, ms) { $('bannerTxt').replaceChildren(document.createTextNode(txt)); if (sub) { const s = document.createElement('small'); s.textContent = sub; $('bannerTxt').append(s); } $('banner').classList.add('on'); clearTimeout(banT); banT = setTimeout(() => $('banner').classList.remove('on'), ms || 4200); }
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
function showCard(spec) {
  const card = $('card'); card.replaceChildren(); card.className = 'card' + (spec.cls ? ' ' + spec.cls : '');
  if (spec.eyebrow) card.append(el('div', 'eyebrow', spec.eyebrow));
  if (spec.title) card.append(el('h2', 'ctitle', spec.title));
  (spec.lines || []).forEach(l => card.append(el('p', 'line' + (l.cls ? ' ' + l.cls : ''), l.t != null ? l.t : l)));
  if (spec.text) card.append(el('p', 'copy', spec.text));
  if (spec.small) card.append(el('p', 'copy dim', spec.small));
  if (spec.list) { const ul = el('div', 'list'); spec.list.forEach(it => { const b = el('button', null, it.label); b.type = 'button'; b.disabled = !!it.disabled; if (it.onClick) b.addEventListener('click', it.onClick); ul.append(b); }); card.append(ul); }
  const row = el('div', 'btns'); primaryBtn = null;
  (spec.buttons || []).forEach((b, i) => { const bt = el('button', 'btn' + (b.quiet ? ' quiet' : ''), b.label); bt.type = 'button'; bt.addEventListener('click', () => { hideCard(); b.onClick && b.onClick(); }); row.append(bt); if (i === 0) primaryBtn = bt; });
  if (spec.buttons && spec.buttons.length) card.append(row);
  $('overlay').hidden = false;
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) { /* ignore */ }
  requestAnimationFrame(() => { const f = card.querySelector('button:not(:disabled)'); if (f) f.focus({ preventScroll: true }); });
}
function hideCard() { $('overlay').hidden = true; primaryBtn = null; }
function relock() { if (matchMedia('(pointer: coarse)').matches) return; try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
function resume() { S.mode = 'play'; relock(); }
function docLines(d) { const l = d.lines.map(t => (t.charAt(0) === '(' ? { t, cls: 'mood' } : { t })); if (d.margin) l.push({ t: d.margin, cls: 'margin' }); return l; }
function refreshProgress() {
  $('count').textContent = S.read.size + ' / ' + DOCS.length;
  const o = $('objective');
  if (S.chapter === 0) o.textContent = S.tutorialChase === 1 ? 'RUN. The loading dock is south of the boiler hall.' : (IDOORS.sealed.open ? 'The sealed door is open. Go east.' : 'Find any 3 pages (' + Math.min(3, [...S.read].filter(i => i < 7).length) + ' of 3). Keep out of the light.');
  else if (S.finale) o.textContent = 'Do not run.';
  else if (S.memories >= 3) o.textContent = 'A violet light stands over the water tower. Go in. Do not run.';
  else o.textContent = 'Find where she was seen (' + S.memories + ' of 3 needed): church, school, diner, clinic. Any three, any order. Lanterns will bring you back. Optional: the five houses of the Oath keep a flame each (' + S.flames.size + ' of 5).';
}
function showDoc(i, back) {
  const d = DOCS[i];
  showCard({ cls: 'paper' + (d.kid ? ' kid' : ''), eyebrow: d.stamp, title: d.title, lines: docLines(d), buttons: back ? [{ label: 'Back', onClick: () => { S.mode = 'play'; openCaseFile(); } }, { label: 'Close', quiet: true, onClick: resume }] : [{ label: 'Put it back', onClick: () => afterDoc(i) }] });
}
function openCaseFile() {
  if (S.mode !== 'play') return; S.mode = 'card';
  showCard({ eyebrow: 'What you know', title: 'Case file', list: DOCS.map((d, i) => ({ label: S.read.has(i) ? d.title : '— not found yet —', disabled: !S.read.has(i), onClick: () => { hideCard(); showDoc(i, true); } })), buttons: [{ label: 'Close', onClick: resume }] });
}
function pause() {
  if (S.mode !== 'play') return; S.mode = 'card';
  showCard({ eyebrow: 'Paused', title: 'Hold still', text: 'Nothing out there moves while you are not looking. That is only a courtesy of the game.', buttons: [{ label: 'Resume', onClick: resume }] });
}

/* ---------- reading pages ---------- */
function readClue(c) {
  const id = c.id, first = !S.read.has(id);
  S.read.add(id); S.mode = 'card'; sfxPage(); if (first) addCoins(10); S.hiding = null;
  if (id < 7 && S.chapter === 0) S.ck = { x: S.px, z: S.pz, yaw: S.yaw };
  if (first) { S.justRead = id; const o = clueObjs[clues.indexOf(c)]; o.beam.visible = false; o.glow.material.opacity = 0.12; o.paper.material.color.set(0x7a7766); }
  refreshProgress(); showDoc(id);
}
function afterDoc(id) {
  S.mode = 'play'; relock();
  if (S.justRead !== id) return; S.justRead = -1;
  if (id < 7) { if ([...S.read].filter(i => i < 7).length >= 3 && !IDOORS.sealed.open) openSealed(); }
  else { S.memories++; refreshProgress(); triggerAmbush(poiList.find(p => p.id === ['church', 'school', 'diner', 'clinic'][id - 7])); if (S.memories === 2) { S.tallOn = true; } if (S.memories === 3) openTowerGate(); }
}
function openSealed() { IDOORS.sealed.locked = false; IDOORS.sealed.open = true; sfxDoor(); refreshProgress(); say('Enough of the night. Somewhere east, a door lets go.', 6500); }
function openTowerGate() { IDOORS.gate.locked = false; IDOORS.gate.open = true; towerBeam.visible = true; sfxSting(2); say('Three pages is enough, if you are ready. A violet light stands up over the water tower and its gate is open. The fourth place can wait, or not.', 7000); refreshProgress(); }
function triggerAmbush(poi) {
  if (!poi) return;
  const cx = (poi.inside[0] + poi.inside[2] / 2) * CS, cz = (poi.inside[1] + poi.inside[3] / 2) * CS;
  bl.x = cx; bl.z = cz; bl.r = 30; bl.until = S.t + 26; S.shake = 0.7; sfxSting(2);
  say('The lights die. The page was holding something shut.', 4500);
  poi.spawns.forEach(sp => {
    const g = guards.find(q => q.ambush && !q.active); if (!g) return;
    g.x = sp[0] * CS; g.z = sp[1] * CS; g.state = 'chase'; g.alert = 1; g.last = [S.px, S.pz]; g.loseT = 0; g.hideKnown = null; g.spot = null; g.h = Math.atan2(S.px - g.x, S.pz - g.z); setActive(g, true); setPath(g, S.px, S.pz);
  });
}

/* ---------- the tutorial chase, and leaving the Institute ---------- */
function startTutorialChase() {
  S.tutorialChase = 1; IDOORS.dock.locked = false; sfxSting(2); S.shake = 1;
  bl.x = S.px; bl.z = S.pz; bl.r = 400; bl.until = S.t + 40;
  guards.forEach(g => { if (g.zone === 'inst' && g.active) { g.state = 'chase'; g.alert = 1; g.last = [S.px, S.pz]; g.loseT = 0; setPath(g, S.px, S.pz); } });
  say('The Lathe wakes. The night is replaying, and every searcher has turned toward you. Run. The loading dock is south of the boiler hall.', 8000);
  refreshProgress();
}
function leaveInstitute() {
  S.chapter = 1; S.tutorialChase = 2; DIFF.detect = SET.diff * 1.25; DIFF.chase = 5.9; bl.until = 0;
  guards.forEach(g => { if (g.zone === 'inst') setActive(g, false); else if (g.zone === 'town' && !g.ambush && g !== tallOne) { resetGuard(g); setActive(g, true); } });
  const l = lanterns[0]; l.lit = true; l.src.int = 1.2; S.ck = { x: l.x, z: l.z + 1.5, yaw: S.yaw, lantern: l }; S.battery = Math.min(100, S.battery + 25);
  dirT = 45; refreshProgress();
  banner('Meridian', '3 a.m. They are still looking.', 5500);
  setTimeout(() => say('The town is lit like a held breath. Find where she was seen. Lanterns will bring you back.', 6500), 2500);
}

/* ---------- being caught ---------- */
function catchPlayer(g, kind) {
  if (S.mode !== 'play') return;
  S.mode = 'caught'; g.state = 'grab'; guards.forEach(o => { o.speedNow = 0; });
  const dx = g.x - S.px, dz = g.z - S.pz; S.hiding = null; S.holding = false; S.yaw = Math.atan2(-dx, -dz); S.pitch = 0.1;
  sfxScare(); S.shake = 1.4; const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 0.85; setTimeout(() => { f.style.transition = 'opacity 1.2s'; f.style.opacity = 0; }, 60);
  $('darkTxt').textContent = kind === 'count' ? 'You looked away, and it was nearer. You looked back, and it was in the room.' : kind === 'hide' ? 'The door opens. The mask is very close, and it has been waiting a long time.' : 'It does not hurt. It is only very close and very cold, and then you are somewhere else.';
  setTimeout(() => $('dark').classList.add('on'), 1100);
  setTimeout(respawn, 4200);
}
function respawn() {
  S.px = S.ck.x; S.pz = S.ck.z; S.yaw = S.ck.yaw; S.pitch = 0; S.meter = 0; S.fear = 0; S.stamina = 100; S.exhausted = false; S.crouch = false; S.deaths++;
  const wasFinale = S.finale; S.finale = 0; bl.until = 0;
  guards.forEach(g => { resetGuard(g); if (g.ambush || g === tallOne) setActive(g, false); else setActive(g, (S.chapter === 0 ? g.zone === 'inst' : g.zone === 'town')); });
  if (S.chapter === 0 && S.tutorialChase === 1) { S.tutorialChase = 0; guards.forEach(g => { if (g.zone === 'inst') resetGuard(g); }); }
  dirT = 30; $('dark').classList.remove('on'); S.mode = 'play'; mergeReset(false); refreshProgress();
  say(wasFinale ? 'You wake at the gate. It is still there. Be still.' : 'You wake where you last felt safe. ' + (S.deaths > 2 ? 'It is learning how you move.' : 'They are walking again.'), 5000);
}

/* ---------- the stillness: the ending ---------- */
function startFinale() {
  S.finale = 1; S.finaleT = 0; S.hiding = null;
  guards.forEach(g => { if (g !== tallOne) setActive(g, false); });
  const c = nearestCell(cellOf(TOWER.x + 34), cellOf(TOWER.z + 2)); tallOne.x = wc(c[0]); tallOne.z = wc(c[1]); tallOne.path = []; tallOne.state = 'finale'; tallOne.fSpeed = 1.9; tallOne.recalc = 0; setActive(tallOne, true);
  banner('Do not run', 'Stillness is invisible to them.', 6000); sfxSting(2); refreshProgress();
}
function updateFinale(dt) {
  const g = tallOne, d = Math.hypot(g.x - S.px, g.z - S.pz);
  if (S.finale === 1) {
    g.recalc -= dt; if (g.recalc <= 0) { setPath(g, S.px, S.pz); g.recalc = 1; }
    g.fSpeed = S.moving ? (d < 14 ? 6.8 : 3.4) : 1.9; S.fear = Math.max(S.fear, 0.5);
    if (S.moving && d < 7) { catchPlayer(g, 'chase'); return; }
    if (d < 2.6) { S.finale = 2; S.finaleT = 0; g.path = []; g.fSpeed = 0; say('It stops beside you. Every instinct you own is running. Stay.', 6000); S.shake = 0.5; }
  } else if (S.finale === 2) {
    S.finaleT += dt; g.h = Math.atan2(S.px - g.x, S.pz - g.z); S.fear = 1; S.shake = Math.max(S.shake, 0.08);
    if (S.moving || S.sprint) { catchPlayer(g, 'chase'); return; }
    if (S.finaleT > 9) finaleDone();
  }
}
function finaleDone() {
  S.finale = 3; S.mode = 'finale'; sfxEnd();
  showCard({ cls: 'scene', eyebrow: 'The tower', lines: [
    { t: 'It is as tall as the tower’s shadow and as thin as a held breath, and you know it before you can name it. It is the fear she left in the dark, grown tall on every night nobody sat with it.', cls: 'mood' },
    { t: 'You tell yourself the thing you were told once, in a dark room: you are going to be fine. You already were.', cls: 'mood' },
    { t: 'It kneels. It folds down the way something does when it has been standing too long. It gets small. It is nine years old and holding a lantern, and she is looking up at someone she has known all her life.', cls: 'mood' }],
    buttons: [{ label: 'Look at her', onClick: finale1 }] });
}
function finale1() {
  showCard({ cls: 'scene', eyebrow: 'Hall Four', lines: [
    { t: '“You’re the gray lady.”', cls: 'her' }, { t: 'Yes.' }, { t: '“You’re late.”', cls: 'her' },
    { t: '“Mr. Marrow says people who are late are never really late. They’re just somewhere else first.”', cls: 'her' }],
    buttons: [{ label: 'Sit with her', onClick: () => finale2(false) }, { label: 'Tell her everything', onClick: () => finale2(true) }, { label: 'Say nothing. Hold the lantern', onClick: () => finale2(2) }] });
}
function finale2(tell) {
  const lines = tell === 2 ? [
    { t: 'You say nothing. You take the lantern from her hand, and she lets you, and the two of you hold it between you the way two people hold a rope.', cls: 'mood' },
    { t: '\u201cYou don\u2019t have to say anything,\u201d she says. \u201cI already know how it goes.\u201d', cls: 'her' },
    { t: 'She is right. You were always going to arrive. Nobody ever needed to be told.', cls: 'mood' }] : tell ? [
    { t: 'You open your mouth to tell her all of it: every year, every door, the long way around. The whole of her life is right there in your throat.', cls: 'mood' },
    { t: '“No.”', cls: 'her' }, { t: '“Then I’d only be walking toward it. Let me walk.”', cls: 'her' },
    { t: 'And you understand the one thing the fourth dimension was ever trying to teach you: how to let someone walk.', cls: 'mood' }] : [
    { t: 'You sit down on the cold ground beside her. Your knees complain. She leans her whole weight on your arm, the way she did once, with no idea who she is leaning on.', cls: 'mood' },
    { t: '“Do I get out?”', cls: 'her' }, { t: 'A long time from now. The long way around. Every day of it is already lit.' },
    { t: '“Okay.”', cls: 'her' }, { t: 'She holds the lantern up for both of you.', cls: 'mood' }];
  showCard({ cls: 'scene', eyebrow: tell === 2 ? 'You hold the light' : tell ? 'You tell her' : 'You stay', lines, buttons: [{ label: 'Continue', onClick: finale3 }] });
}
function finale3() {
  showCard({ cls: 'scene', eyebrow: 'The rumor, corrected', title: 'Hall Four', lines: [
    { t: 'They said a girl slipped into the fourth dimension. She did not slip. She stayed in the one place that was not afraid, the middle of her own life.' },
    { t: 'The searchers were never hunting a child. They were hunting fear, and fear was only ever a child in the dark who had not yet been sat beside.' },
    { t: 'The comfort she remembered all her life, the gray coat, the peppermint, the promise, was herself.', cls: 'mood' },
    ...(S.counted ? [{ t: 'All five flames came with you, so the Count walked you to the gate, and bowed, and did not look back.', cls: 'mood' }] : []),
    { t: 'We are each other’s long-ago rescuers. Somewhere behind you, a small light has come on.' }],
    buttons: [{ label: 'Walk out', onClick: resetAll }] });
}
function resetAll() {
  S.read.clear(); S.memories = 0; S.chapter = 0; S.tutorialChase = 0; S.finale = 0; S.tallOn = false; S.deaths = 0; S.battery = 100; S.stamina = 100; S.bottles = 0; S.flash = true; S.hiding = null; S.crouch = false; S.meter = 0; S.fear = 0;
  DIFF.detect = SET.diff; DIFF.chase = 5.1; bl.until = 0; towerBeam.visible = false;
  doors.forEach(d => { d.open = false; d.anim = 0; d.locked = (d.tag === 'sealed' || d.tag === 'dock' || d.tag === 'tower-gate'); });
  pickups.forEach(p => { p.taken = false; p.mesh.visible = true; p.glow.visible = true; });
  lanterns.forEach(l => { l.lit = false; if (l.src) { l.src.int = 0.9; l.src.r = 9; } });
  clueObjs.forEach(o => { o.beam.visible = true; o.glow.material.opacity = 0.75; o.paper.material.color.set(0xfff2c8); });
  S.px = START.x; S.pz = START.z; S.yaw = START.yaw; S.pitch = 0; S.ck = { x: START.x, z: START.z, yaw: START.yaw };
  guards.forEach(g => { resetGuard(g); setActive(g, g.zone === 'inst' && !g.ambush); });
  mergeReset(true); refreshProgress(); introCard();
}

/* ---------- intro and start ---------- */
function introCard() {
  S.mode = 'menu'; refreshProgress();
  showCard({ eyebrow: 'Meridian Institute · 3 a.m.', title: 'The Girl in the Walls', lines: [
    { t: 'They say a girl named Lyra, called Odile in the Institute’s records, slipped into the fourth dimension, and that the building still remembers.' },
    { t: 'The searchers are still looking. They do not hear well, but they see a hurry from far away and they never tire.', cls: 'mood' },
    { t: 'Stay out of the light. Walk slowly near them, crouch to be quiet. Hide in lockers and under desks, and hold your breath when they come close. If one sees you, run, and break the line of sight.', cls: 'mood' },
    { t: 'Headphones recommended. It is a horror game, and it means it.', cls: 'mood' }],
    buttons: [{ label: 'Enter the Institute', onClick: startGame }] });
}
function startGame() {
  initAudio(); applySettings(); S.mode = 'play'; S.t = 0; relock();
  banner('Hall Four', 'Find any three pages.', 4500);
  setTimeout(() => say('Move slowly. Crouch to be quiet. Find the pages.', 6000), 1500);
  refreshProgress();
}

/* ---------- input ---------- */
